<div class="container">
  <img src"" alt"DBITlogo" class="logo">
  <h2>TEAM - D MAPS</h2>
  <h1><u><span style="color: gray;">CALORIE COACH</span></u></h1>

  <form id="calorie-form">
    <label for="age">Age (years):</label>
    <input type="number" id="age" required>

    <label for="height">Height (cm):</label>
    <input type="number" id="height" required>

    <label for="weight">Weight (kg):</label>
    <input type="number" id="weight" required>

    <label for="isVeg">Food type:</label>
    <select id="isVeg" required>
      <option value="1">Vegetarian</option>
      <option value="0">Non-Vegetarian</option>
    </select>

    <button type="submit">Calculate</button>
  </form>

  <div id="suggestions"></div>
</div>
<div id="resultPage" style="display:none; text-align:center; padding:40px;">
  <h2><u>Calorie Result</u></h2>
  <div id="resultContent"></div>
  <br>
  <button onclick="goBack()">⬅ Back</button>
</div>
